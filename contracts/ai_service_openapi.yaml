openapi: 3.0.3
info:
  title: AURA AI Analysis Service API
  description: >
    Hợp đồng giao tiếp API (Module M4 - Computer Vision & AI Service) cho hệ thống AURA.
    Cung cấp các endpoint phục vụ suy luận phân vùng mạch máu võng mạc, trích xuất đặc trưng hình học
    và tính toán chỉ số nguy cơ tim mạch/đột quỵ theo thuật toán Heuristic.
  version: 1.0.0
  contact:
    name: Dao Duy Quan (M4 Lead)
    email: quandd2937@ut.edu.vn

servers:
  - url: http://localhost:8000
    description: Local development / Docker container
  - url: http://ai-service:8000
    description: Internal Docker network (Gateway M1 -> AI M4)

tags:
  - name: Health
    description: Kiểm tra tình trạng hoạt động của service
  - name: Analysis
    description: Phân tích hình ảnh võng mạc và đánh giá chỉ số

paths:
  /health:
    get:
      tags:
        - Health
      summary: Kiểm tra trạng thái hoạt động của AI Service
      operationId: checkHealth
      responses:
        '200':
          description: Service hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                version: "1.0.0"
                service: "aura-ai-service"
                device: "cuda:0"
                model_loaded: true
                uptime_seconds: 3600.5

  /api/v1/analyze:
    post:
      tags:
        - Analysis
      summary: Phân tích ảnh võng mạc (JSON payload Base64)
      description: Nhận ảnh dưới dạng Base64 cùng thông tin bệnh nhân, thực hiện phân vùng mạch máu và trích xuất chỉ số.
      operationId: analyzeRetinaBase64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            example:
              request_id: "req_aura_20261005_001"
              patient_id: "PAT-88231"
              eye_side: "right"
              mode: "retina_vessels"
              image_base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
              include_mask: true
              include_overlay: true
      responses:
        '200':
          description: Phân tích thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
              example:
                request_id: "req_aura_20261005_001"
                patient_id: "PAT-88231"
                timestamp: "2026-10-05T17:59:00Z"
                status: "SUCCESS"
                processing_time_ms: 142.5
                image_info:
                  width: 512
                  height: 512
                  channels: 3
                  eye_side: "right"
                metrics:
                  vessel_density: 0.1428
                  tortuosity_index: 1.185
                  av_ratio: 0.672
                  fractal_dimension: 1.482
                  branching_points: 64
                risk_assessment:
                  risk_score: 0.35
                  risk_level: "LOW"
                  confidence_score: 0.88
                  indicators:
                    - "Mật độ mạch máu trong giới hạn bình thường (14.28%)"
                    - "Chỉ số xoắn mạch (Tortuosity) ổn định"
                  disclaimer: "Kết quả ước lượng dựa trên hình học mạch máu võng mạc (Heuristic). Không thay thế chẩn đoán y khoa chính thức."
                segmentation:
                  mask_format: "png_base64"
                  mask_base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
                  overlay_base64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Lỗi định dạng JSON hoặc thiếu trường bắt buộc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi nội bộ trong quá trình xử lý AI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - service
        - model_loaded
      properties:
        status:
          type: string
          example: "healthy"
        version:
          type: string
          example: "1.0.0"
        service:
          type: string
          example: "aura-ai-service"
        device:
          type: string
          example: "cpu"
        model_loaded:
          type: boolean
          example: true
        uptime_seconds:
          type: number
          format: float
          example: 124.8

    EyeSide:
      type: string
      enum: [left, right, unknown]
      example: "right"

    AnalysisMode:
      type: string
      enum: [retina_vessels, iris_biometrics, hybrid]
      default: retina_vessels
      example: "retina_vessels"

    RiskLevel:
      type: string
      enum: [LOW, MODERATE, HIGH]
      example: "LOW"

    AnalysisRequest:
      type: object
      required:
        - request_id
        - image_base64
      properties:
        request_id:
          type: string
          description: Mã định danh duy nhất của yêu cầu (tạo từ M1/M2)
          example: "req_aura_20261005_001"
        patient_id:
          type: string
          nullable: true
          description: Mã định danh bệnh nhân (tùy chọn)
          example: "PAT-88231"
        eye_side:
          $ref: '#/components/schemas/EyeSide'
        mode:
          $ref: '#/components/schemas/AnalysisMode'
        image_base64:
          type: string
          description: Chuỗi ảnh mã hóa Base64 (PNG, JPEG, WebP)
          example: "iVBORw0KGgoAAAANSUhEUgAA..."
        include_mask:
          type: boolean
          default: true
          description: Trả về ảnh mặt nạ nhị phân (Binary Mask)
        include_overlay:
          type: boolean
          default: true
          description: Trả về ảnh phủ viền mạch lên ảnh gốc (Overlay Visual)

    ImageInfo:
      type: object
      required:
        - width
        - height
        - channels
        - eye_side
      properties:
        width:
          type: integer
          example: 512
        height:
          type: integer
          example: 512
        channels:
          type: integer
          example: 3
        eye_side:
          $ref: '#/components/schemas/EyeSide'

    VesselMetrics:
      type: object
      required:
        - vessel_density
        - tortuosity_index
        - av_ratio
        - fractal_dimension
        - branching_points
      properties:
        vessel_density:
          type: number
          format: float
          description: Tỷ lệ diện tích mạch máu trên tổng diện tích vùng võng mạc (0.0 -> 1.0)
          example: 0.1428
        tortuosity_index:
          type: number
          format: float
          description: Chỉ số xoắn của mạng lưới mạch máu (Arc-length / Chord-length)
          example: 1.185
        av_ratio:
          type: number
          format: float
          description: Tỷ lệ đường kính động mạch / tĩnh mạch (Arteriole-to-Venule Ratio)
          example: 0.672
        fractal_dimension:
          type: number
          format: float
          description: Số chiều Fractal biểu thị độ phức tạp phân nhánh
          example: 1.482
        branching_points:
          type: integer
          description: Tổng số điểm phân nhánh của hệ mạch phát hiện được
          example: 64

    RiskAssessment:
      type: object
      required:
        - risk_score
        - risk_level
        - confidence_score
        - indicators
        - disclaimer
      properties:
        risk_score:
          type: number
          format: float
          description: Điểm rủi ro tổng hợp chuẩn hóa (0.0: rất thấp, 1.0: rất cao)
          example: 0.35
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        confidence_score:
          type: number
          format: float
          description: Độ tin cậy của thuật toán phân vùng và ước lượng (0.0 -> 1.0)
          example: 0.88
        indicators:
          type: array
          items:
            type: string
          description: Danh sách các nhận định chi tiết dựa trên từng thông số
          example:
            - "Mật độ mạch máu bình thường"
            - "Độ xoắn mạch trong ngưỡng an toàn"
        disclaimer:
          type: string
          description: Tuyên bố miễn trừ trách nhiệm y khoa bắt buộc theo quy định
          example: "Kết quả mang tính chất tham khảo kỹ thuật, không thay thế chẩn đoán y khoa."

    SegmentationResult:
      type: object
      properties:
        mask_format:
          type: string
          example: "png_base64"
        mask_base64:
          type: string
          nullable: true
          description: Ảnh nhị phân mạch máu (trắng = mạch máu, đen = nền)
        overlay_base64:
          type: string
          nullable: true
          description: Ảnh gốc kèm viền mạch máu màu đỏ/xanh lá để hiển thị cho bác sĩ

    AnalysisResponse:
      type: object
      required:
        - request_id
        - timestamp
        - status
        - processing_time_ms
        - image_info
        - metrics
        - risk_assessment
      properties:
        request_id:
          type: string
          example: "req_aura_20261005_001"
        patient_id:
          type: string
          nullable: true
          example: "PAT-88231"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-05T17:59:00Z"
        status:
          type: string
          enum: [SUCCESS, WARNING, FAILED]
          example: "SUCCESS"
        processing_time_ms:
          type: number
          format: float
          example: 142.5
        image_info:
          $ref: '#/components/schemas/ImageInfo'
        metrics:
          $ref: '#/components/schemas/VesselMetrics'
        risk_assessment:
          $ref: '#/components/schemas/RiskAssessment'
        segmentation:
          $ref: '#/components/schemas/SegmentationResult'

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          example: "INVALID_IMAGE_PAYLOAD"
        message:
          type: string
          example: "Không thể giải mã dữ liệu ảnh Base64 được gửi lên."
        details:
          type: object
          nullable: true
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          example: "2026-10-05T17:59:00Z"
