openapi: 3.1.0
info:
  title: AURA Notification inbox
  version: 1.3.0
servers:
- url: http://127.0.0.1:5300
security:
- userBearer: []
paths:
  /api/v1/admin/notification-templates:
    get:
      operationId: listPushTemplates
      summary: List configured generic push templates for a current SYSTEM_ADMIN
      responses:
        '200':
          description: Current template versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PushTemplate'}}
        '401': {description: Unauthenticated}
        '403': {description: Current SYSTEM_ADMIN required}
        '503': {description: Role lookup unavailable}
  /api/v1/admin/notification-templates/{templateId}:
    put:
      operationId: updateGenericTemplate
      summary: Publish safe generic copy for an existing notification event
      description: Current SYSTEM_ADMIN required. Titles and bodies must come from the exact generic allowlist. No free text is sent to FCM. Links are constructed by the server.
      parameters:
      - in: path
        name: templateId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, title, body, enabled, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                title: &pushTitle
                  type: string
                  enum: ['AURA', '{{app_name}}', 'Thông báo từ {{app_name}}']
                body: &pushBody
                  type: string
                  enum: ['Có thông báo mới. Đăng nhập để xem chi tiết.', 'Đăng nhập để xem chi tiết.', '{{event_label}}. Đăng nhập để xem chi tiết.']
                enabled: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 250}
      responses:
        '200':
          description: Updated template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushTemplate'}
        '400': {description: Invalid input or unsafe template}
        '401': {description: Unauthenticated}
        '403': {description: Current SYSTEM_ADMIN required}
        '409': {description: Version conflict or template unavailable}
        '503': {description: Role lookup unavailable}
  /api/v1/notifications/inbox:
    get:
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: unreadOnly
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Current account only; newest first, stable cursor (createdAt,notificationId),
            no accountId selector
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - notificationId
                      - eventId
                      - analysisId
                      - type
                      - title
                      - isRead
                      - createdAt
                      - readAt
                      - targetPath
                      properties:
                        notificationId: &id001
                          type: string
                          format: uuid
                        eventId: *id001
                        analysisId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        type:
                          enum:
                          - ANALYSIS_COMPLETED
                          - ANALYSIS_FAILED
                          - PAYMENT_SUCCESS
                          - CONSULTATION_MESSAGE
                        title:
                          type: string
                        isRead:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        readAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        targetPath:
                          type: string
                          pattern: '^/(?:(?:analyses|batches)/[0-9a-fA-F-]{36}(?:\?clinicContextId=[0-9a-fA-F-]{36})?|billing/orders/[0-9a-fA-F-]{36}|consultations/[0-9a-fA-F-]{36})$'
                        orderId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                      allOf:
                      - if:
                          properties:
                            type:
                              const: PAYMENT_SUCCESS
                        then:
                          required:
                          - orderId
                          properties:
                            analysisId:
                              type: 'null'
                            orderId:
                              type: string
                              format: uuid
                      - if:
                          properties:
                            type:
                              const: CONSULTATION_MESSAGE
                        then:
                          properties:
                            analysisId:
                              type: 'null'
                            orderId:
                              type: 'null'
                      - if:
                          properties:
                            type:
                              enum:
                              - ANALYSIS_COMPLETED
                              - ANALYSIS_FAILED
                        then:
                          properties:
                            analysisId:
                              type: string
                              format: uuid
                            orderId:
                              type: 'null'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          description: Invalid cursor/limit
        '401':
          description: No valid user identity
  /api/v1/notifications/inbox/unread-count:
    get:
      responses:
        '200':
          description: Current account unread count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - unreadCount
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
        '401':
          description: Unauthenticated
  /api/v1/notifications/inbox/{notificationId}/read:
    post:
      parameters:
      - name: notificationId
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: Read state persisted, idempotent
        '401':
          description: Unauthenticated
        '404':
          description: Missing or another account
  /api/v1/consultations:
    get:
      operationId: listConsultations
      parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: cursor
        in: query
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current authorized consultations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationPage' }
        '401': { description: Unauthenticated }
        '503': { description: Authority or storage unavailable }
    post:
      operationId: createConsultation
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationCreate' }
      responses:
        '201':
          description: Conversation persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consultation' }
        '200': { description: Idempotent replay }
        '400': { description: Invalid request }
        '401': { description: Unauthenticated }
        '403': { description: Current authority denied }
        '409': { description: Idempotency-Key replayed with different payload }
        '503': { description: Authority or storage unavailable }
  /api/v1/consultations/{conversationId}/messages:
    parameters:
    - name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    get:
      operationId: getConsultationMessages
      parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: beforeId
        in: query
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stable cursor page ordered by sentAt and messageId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationMessagesPage' }
        '401': { description: Unauthenticated }
        '403': { description: Current authority denied }
        '404': { description: Missing conversation }
        '503': { description: Authority or storage unavailable }
    post:
      operationId: sendConsultationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationMessageCreate' }
      responses:
        '201':
          description: Message persisted before live broadcast.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationMessage' }
        '200': { description: Idempotent replay }
        '400': { description: Invalid message }
        '401': { description: Unauthenticated }
        '403': { description: Current authority denied }
        '404': { description: Missing conversation }
        '409': { description: clientMessageId replayed with different payload }
        '429':
          description: More than 30 messages in one minute; retry after the response header interval.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        '503': { description: Authority or storage unavailable }
  /api/v1/consultations/{conversationId}/read:
    post:
      operationId: advanceConsultationReadCursor
      parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationReadCursor' }
      responses:
        '200':
          description: Read cursor persisted monotonically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationReceipt' }
        '400': { description: Invalid or foreign message cursor }
        '401': { description: Unauthenticated }
        '403': { description: Current authority denied }
        '404': { description: Missing conversation }
        '503': { description: Authority or storage unavailable }
components:
  schemas:
    PushTemplate:
      type: object
      required: [id, eventType, title, body, enabled, version]
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        title: *pushTitle
        body: *pushBody
        enabled: {type: boolean}
        version: {type: integer}
    ConsultationCreate:
      type: object
      additionalProperties: false
      required: [analysisId, clinicContextId, doctorAccountId]
      properties:
        analysisId: { type: string, format: uuid }
        clinicContextId: { type: string, format: uuid }
        doctorAccountId: { type: string, format: uuid }
    Consultation:
      type: object
      additionalProperties: false
      required: [conversationId, analysisId, clinicContextId, status, unreadCount]
      properties:
        conversationId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        clinicContextId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CLOSED] }
        unreadCount: { type: integer, minimum: 0 }
    ConsultationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Consultation' }
        nextCursor: { type: [string, 'null'], format: uuid }
    ConsultationMessageCreate:
      type: object
      additionalProperties: false
      required: [clientMessageId, text]
      properties:
        clientMessageId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000, description: UTF-8 payload <= 16384 bytes }
    ConsultationMessage:
      type: object
      additionalProperties: false
      required: [messageId, conversationId, clientMessageId, senderAccountId, text, sentAt, deliveryState]
      properties:
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        clientMessageId: { type: string, format: uuid }
        senderAccountId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000 }
        sentAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [PERSISTED, READ] }
    ConsultationMessagesPage:
      type: object
      additionalProperties: false
      required: [items, nextBeforeId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConsultationMessage' }
        nextBeforeId: { type: [string, 'null'], format: uuid }
    ConsultationReadCursor:
      type: object
      additionalProperties: false
      required: [lastReadMessageId]
      properties:
        lastReadMessageId: { type: string, format: uuid }
    ConsultationReceipt:
      type: object
      additionalProperties: false
      required: [id, status, version]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
