openapi: 3.1.0
info:
  title: AURA Notification inbox
  version: 1.3.0
servers:
- url: http://127.0.0.1:5300
security:
- userBearer: []
paths:
  /api/v1/admin/notification-templates:
    get:
      operationId: listPushTemplates
      summary: List configured generic push templates for a current SYSTEM_ADMIN
      responses:
        '200':
          description: Current template versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PushTemplate'}}
        '401': {description: Unauthenticated}
        '403': {description: Current SYSTEM_ADMIN required}
        '503': {description: Role lookup unavailable}
  /api/v1/admin/notification-templates/{templateId}:
    put:
      operationId: updateGenericTemplate
      summary: Publish safe generic copy for an existing notification event
      description: Current SYSTEM_ADMIN required. Titles and bodies must come from the exact generic allowlist. No free text is sent to FCM. Links are constructed by the server.
      parameters:
      - in: path
        name: templateId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, title, body, enabled, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                title: &pushTitle
                  type: string
                  enum: ['AURA', '{{app_name}}', 'Thông báo từ {{app_name}}']
                body: &pushBody
                  type: string
                  enum: ['Có thông báo mới. Đăng nhập để xem chi tiết.', 'Đăng nhập để xem chi tiết.', '{{event_label}}. Đăng nhập để xem chi tiết.']
                enabled: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 250}
      responses:
        '200':
          description: Updated template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushTemplate'}
        '400': {description: Invalid input or unsafe template}
        '401': {description: Unauthenticated}
        '403': {description: Current SYSTEM_ADMIN required}
        '409': {description: Version conflict or template unavailable}
        '503': {description: Role lookup unavailable}
  /api/v1/notifications/inbox:
    get:
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      - name: unreadOnly
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Current account only; newest first, stable cursor (createdAt,notificationId),
            no accountId selector
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - notificationId
                      - eventId
                      - analysisId
                      - type
                      - title
                      - isRead
                      - createdAt
                      - readAt
                      - targetPath
                      properties:
                        notificationId: &id001
                          type: string
                          format: uuid
                        eventId: *id001
                        analysisId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        type:
                          enum:
                          - ANALYSIS_COMPLETED
                          - ANALYSIS_FAILED
                          - PAYMENT_SUCCESS
                        title:
                          type: string
                        isRead:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        readAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        targetPath:
                          type: string
                          pattern: '^/(?:(?:analyses|batches)/[0-9a-fA-F-]{36}(?:\?clinicContextId=[0-9a-fA-F-]{36})?|billing/orders/[0-9a-fA-F-]{36})$'
                        orderId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                      allOf:
                      - if:
                          properties:
                            type:
                              const: PAYMENT_SUCCESS
                        then:
                          required:
                          - orderId
                          properties:
                            analysisId:
                              type: 'null'
                            orderId:
                              type: string
                              format: uuid
                        else:
                          properties:
                            analysisId:
                              type: string
                              format: uuid
                            orderId:
                              type: 'null'
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          description: Invalid cursor/limit
        '401':
          description: No valid user identity
  /api/v1/notifications/inbox/unread-count:
    get:
      responses:
        '200':
          description: Current account unread count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - unreadCount
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
        '401':
          description: Unauthenticated
  /api/v1/notifications/inbox/{notificationId}/read:
    post:
      parameters:
      - name: notificationId
        in: path
        required: true
        schema: *id001
      responses:
        '204':
          description: Read state persisted, idempotent
        '401':
          description: Unauthenticated
        '404':
          description: Missing or another account
components:
  schemas:
    PushTemplate:
      type: object
      required: [id, eventType, title, body, enabled, version]
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        title: *pushTitle
        body: *pushBody
        enabled: {type: boolean}
        version: {type: integer}
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
