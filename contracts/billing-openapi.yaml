openapi: 3.0.3
info:
  title: AURA Billing API
  version: 0.5.0
  description: Billing API with published price versions and PostgreSQL ledger reads.
    Internal endpoints are service-to-service only.
servers:
- url: http://127.0.0.1:5002
  description: Local Development Billing API
paths:
  /api/v1/admin/billing/packages:
    get:
      operationId: listAdminPackages
      summary: Read the latest version of each active or retired package
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {in: query, name: cursor, schema: {type: string, maxLength: 32}}
      responses:
        '200':
          description: Stable package ID pagination; money is in minor units.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AdminPackage'}}
                  nextCursor: {type: string, nullable: true}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
    post:
      operationId: createPackage
      summary: Publish the first version of a new package
      description: Requires current SYSTEM_ADMIN. Use expectedVersion 0.
      security: [{FirebaseBearer: []}]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: &priceRequest
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishPrice'}
      responses: &priceResponses
        '200': {$ref: '#/components/responses/PricePublication'}
        '201': {$ref: '#/components/responses/PricePublication'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/admin/billing/packages/{packageId}/price-versions:
    post:
      operationId: createPriceVersion
      summary: Publish a new price version and retire the active version atomically
      description: Requires current SYSTEM_ADMIN. Order snapshots remain immutable.
      security: [{FirebaseBearer: []}]
      parameters:
      - in: path
        name: packageId
        required: true
        schema: {type: integer, minimum: 1}
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: *priceRequest
      responses: *priceResponses
  /api/v1/admin/billing/packages/{packageId}/status:
    patch:
      operationId: retirePackage
      summary: Stop selling the latest price version without changing existing order snapshots
      description: Same command key and payload replay the original receipt even after another price is published. Retirement keeps the price version number; a new publication increments it.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: path, name: packageId, required: true, schema: {type: integer, minimum: 1}}
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, status, reason]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                status: {type: string, enum: [RETIRED]}
                reason: {type: string, minLength: 1, maxLength: 250}
      responses:
        '200':
          description: Retirement receipt; an exact replay returns Idempotent-Replayed true.
          content:
            application/json:
              schema:
                type: object
                required: [packageId, priceVersionId, version, status]
                properties:
                  packageId: {type: integer}
                  priceVersionId: {type: string, format: uuid}
                  version: {type: integer, minimum: 1}
                  status: {type: string, enum: [RETIRED]}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/billing/orders:
    get:
      operationId: listOwnerOrders
      summary: List order snapshots for the authorized wallet
      description: Requires current BILLING_READ. The server selects TEST or LIVE.
      security: [{FirebaseBearer: []}]
      parameters:
      - &ownerType {in: query, name: ownerType, required: true, schema: {type: string, enum: [ACCOUNT, CLINIC]}}
      - &ownerId {in: query, name: ownerId, required: true, schema: {type: string, format: uuid}}
      - &pageLimit {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - &pageCursor {in: query, name: cursor, schema: {type: string, maxLength: 96}}
      responses:
        '200':
          description: Newest orders first with a stable PostgreSQL cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, environment]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OrderHistoryEntry'}}
                  nextCursor: &cursorValue {type: string, nullable: true}
                  environment: &billingEnvironment {type: string, enum: [TEST, LIVE]}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
    post:
      operationId: createBillingOrder
      summary: Create a sandbox order at a published price
      description: Send packagePriceVersionId from the catalog. A retired quote returns ERR_PRICE_VERSION_CHANGED without creating an order. An exact replay returns the original snapshot.
      security: [{FirebaseBearer: []}]
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billingOwner, packageId]
              properties:
                billingOwner:
                  type: object
                  required: [type, id]
                  properties:
                    type: {type: string, enum: [ACCOUNT, CLINIC]}
                    id: {type: string, format: uuid}
                packageId: {type: integer, minimum: 1}
                packagePriceVersionId: {type: string, format: uuid}
                paymentMethod: {type: string, enum: [SANDBOX_MOCK]}
      responses:
        '200': &createdOrder
          description: Immutable sandbox order snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [orderId, status, amount, currency, credits, packageName, paymentUrl, createdAt, priceVersionId]
                properties:
                  orderId: {type: string, format: uuid}
                  status: {type: string}
                  amount: {type: number}
                  currency: {type: string}
                  credits: {type: integer}
                  packageName: {type: string}
                  paymentUrl: {type: string}
                  createdAt: {type: string, format: date-time}
                  priceVersionId: {type: string, format: uuid}
        '201': *createdOrder
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/billing/usage:
    get:
      operationId: getOwnerUsage
      summary: Read authorized append-only credit ledger entries
      description: Requires current BILLING_READ. The inclusive from and exclusive to may span up to 366 days. CAPTURE has zero balance delta because RESERVE already debited the wallet.
      security: [{FirebaseBearer: []}]
      parameters:
      - *ownerType
      - *ownerId
      - *pageLimit
      - *pageCursor
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Newest ledger entries first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, environment]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/UsageEntry'}}
                  nextCursor: *cursorValue
                  environment: *billingEnvironment
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/billing/summary:
    get:
      operationId: getClinicBillingSummary
      summary: Aggregate paid orders for the authorized clinic
      description: Requires the caller's Firebase bearer and current Profile BILLING_READ authority for the requested clinic. UTC range is inclusive from and exclusive to, up to 366 days. Results use Billing's configured environment and remain grouped by currency.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: ownerType, required: true, schema: {type: string, enum: [CLINIC]}}
      - {in: query, name: ownerId, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
      - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Payment totals for the authorized clinic without patient identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, groups]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  groups:
                    type: array
                    items:
                      type: object
                      required: [environment, currency, paidOrders, paidAmount]
                      properties:
                        environment: *billingEnvironment
                        currency: {type: string, minLength: 3, maxLength: 3}
                        paidOrders: {type: integer, format: int64, minimum: 0}
                        paidAmount: {type: number, minimum: 0}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/admin/billing/summary:
    get:
      operationId: getAdminBillingSummary
      summary: Aggregate completed payments by currency and environment
      description: Requires current SYSTEM_ADMIN. Counts each completed order with a matching successful payment once. Defaults to the preceding 30 days.
      security: [{FirebaseBearer: []}]
      parameters:
      - {in: query, name: from, schema: {type: string, format: date-time}}
      - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Payment totals without owner or patient identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, groups]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  groups:
                    type: array
                    items:
                      type: object
                      required: [environment, currency, paidOrders, paidAmount]
                      properties:
                        environment: *billingEnvironment
                        currency: {type: string}
                        paidOrders: {type: integer, format: int64}
                        paidAmount: {type: number}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /api/v1/billing/wallets/{ownerType}/{ownerId}:
    get:
      operationId: getBillingWallet
      summary: Read the current wallet balance for a server-authorized owner
      description: Requires a real Firebase bearer and Profile BILLING_READ authorization. Environment comes from server configuration. A missing wallet has balance zero; this GET never creates one. Response is no-store.
      security:
      - FirebaseBearer: []
      parameters:
      - in: path
        name: ownerType
        required: true
        schema: {type: string, enum: [ACCOUNT, CLINIC]}
      - in: path
        name: ownerId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current balance, isolated by owner and configured environment
          content:
            application/json:
              schema:
                type: object
                required: [ownerType, ownerId, environment, balance]
                properties:
                  ownerType: {type: string, enum: [ACCOUNT, CLINIC]}
                  ownerId: {type: string, format: uuid}
                  environment: {type: string, enum: [TEST, LIVE]}
                  balance: {type: integer, minimum: 0}
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/billing/notification-context/resolve:
    post:
      operationId: resolvePaymentNotificationContext
      summary: Resolve a canonical completed payment for notification-api
      description: Requires audience aura-billing, client notification-api and scope billing:notify. Event, order and tenant must match the committed payment outbox. The recipient is the verified purchaser account.
      security:
      - ServiceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, orderId, tenantId]
              properties:
                eventId: {type: string, format: uuid}
                orderId: {type: string, format: uuid}
                tenantId: {type: string, format: uuid}
      responses:
        '200':
          description: Authoritative completed payment context
          content:
            application/json:
              schema:
                type: object
                required: [eventId, orderId, tenantId, recipientAccountId, status]
                properties:
                  eventId: {type: string, format: uuid}
                  orderId: {type: string, format: uuid}
                  tenantId: {type: string, format: uuid}
                  recipientAccountId: {type: string, format: uuid}
                  status: {type: string, enum: [COMPLETED]}
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/billing/packages:
    get:
      operationId: getPackageCatalog
      summary: Get the published package catalog
      description: Anonymous endpoint backed by current active prices in PostgreSQL. Cache fields are retained for response compatibility.
      responses:
        '200':
          description: Catalog returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - source
                - cacheHit
                - ttlSeconds
                - databaseReadCount
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Package'
                  source:
                    type: string
                  cacheHit:
                    type: boolean
                  ttlSeconds:
                    type: integer
                  databaseReadCount:
                    type: integer
  /api/v1/billing/packages/{id}:
    put:
      operationId: updateLegacyPackage
      deprecated: true
      summary: Update the legacy PoC package
      description: Requires a valid Firebase user token whose current Identity roles
        include SYSTEM_ADMIN. Updates only the archived PoC catalog, with no effect on quotes or orders.
      security:
      - FirebaseBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePackageRequest'
      responses:
        '200':
          description: Package updated and cache invalidation attempted.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/billing/reservations:
    post:
      operationId: reserveAnalysisCredit
      summary: Reserve one credit for a new FUNDUS analysis
      description: Caller must be analysis-api with billing:reserve. Billing environment
        and mock mode are server configuration, not request fields. Billing re-resolves
        access with Profile and verifies that tenant, patient and billing owner match
        the request before changing credit.
      security:
      - ServiceBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveCreditRequest'
      responses:
        '201':
          description: New reservation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '200':
          description: Idempotent replay of the same request.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '402':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/billing/reservations/{reservationId}:
    get:
      operationId: getBillingReservation
      summary: Read a reservation state
      security:
      - ServiceBearer: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Reservation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/billing/reservations/{reservationId}/capture:
    post:
      operationId: captureBillingReservation
      summary: Capture a reservation after a valid completed result
      description: Requires the billing:capture scope. In the current contract, the
        event consumer should call the domain service in-process; this HTTP route
        is retained for the internal interface and is not authorized for analysis-api
        by the current registry.
      security:
      - ServiceBearer: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '200':
          description: Captured or idempotently replayed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/billing/reservations/{reservationId}/release:
    post:
      operationId: releaseBillingReservation
      summary: Release a reservation after a confirmed abort/final failure
      security:
      - ServiceBearer: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreditRequest'
      responses:
        '200':
          description: Released or idempotently replayed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/admin/billing/reservations/batch-refund:
    post:
      summary: Audited full refund approved by a verified SYSTEM_ADMIN
      description: Firebase token resolved by Identity; actor/role headers grant no
        permission. Full refund once per captured reservation; same key/different
        reason or approval conflicts. Ledger retains approved_by/refund_authority.
        No partial-credit refund.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenantId
              - items
              properties:
                tenantId: *id001
                batchId: *id001
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - reservationId
                    - reason
                    properties:
                      reservationId: *id001
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 500
      responses:
        '200':
          description: Per-reservation full-refund/replay results
        '401':
          description: Invalid Firebase token
        '403':
          description: SYSTEM_ADMIN required
        '409':
          description: Idempotency or reservation state conflict
  /internal/v1/billing/reservations/batch-refund:
    post:
      summary: Evidence-bound terminal release/full-refund
      description: Analysis service identity only. billing:release for RESERVED; billing:refund
        for CAPTURED. Authoritative Analysis RELEASE evidence must match tenant,analysis,reservation,generation.
        UNKNOWN/active outcomes return conflict and retain held credit. Refund authority
        and evidence are audited.
      responses:
        '200':
          description: Idempotent per-reservation outcome
        '403':
          description: Service/scope denied
        '409':
          description: No authoritative terminal release evidence
        '503':
          description: Evidence unavailable; HOLD
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: Service JWT RS256
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
  schemas:
    AdminPackage:
      type: object
      required: [packageId, priceVersionId, displayName, amountMinor, currency, credits, status, version]
      properties:
        packageId: {type: integer, minimum: 1}
        priceVersionId: {type: string, format: uuid}
        displayName: {type: string}
        amountMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [VND, USD, EUR]}
        credits: {type: integer, minimum: 1}
        status: {type: string, enum: [ACTIVE, RETIRED]}
        version: {type: integer, minimum: 1}
    OwnerMoneySummary:
      type: object
      required: [from, to, groups]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        groups:
          type: array
          items:
            type: object
            required: [environment, currency, paidOrders, paidAmount]
            properties:
              environment: {type: string, enum: [TEST, LIVE]}
              currency: {type: string}
              paidOrders: {type: integer, minimum: 0}
              paidAmount: {type: number, minimum: 0}
    PublishPrice:
      type: object
      required: [expectedVersion, displayName, amountMinor, currency, credits, reason]
      additionalProperties: false
      properties:
        expectedVersion: {type: integer, minimum: 0}
        displayName: {type: string, minLength: 1, maxLength: 100}
        amountMinor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [VND, USD, EUR]}
        credits: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 250}
    OrderHistoryEntry:
      type: object
      required: [id, priceVersionId, packageName, amount, currency, credits, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        priceVersionId: {type: string, format: uuid}
        packageName: {type: string}
        amount: {type: number}
        currency: {type: string}
        credits: {type: integer}
        status: {type: string, enum: [PENDING, COMPLETED, CANCELLED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UsageEntry:
      type: object
      required: [id, entryType, balanceDelta, balanceAfter, reservationUnits, orderId, reservationId, createdAt]
      properties:
        id: {type: string, format: uuid}
        entryType: {type: string, enum: [CREDIT, RESERVE, CAPTURE, RELEASE, ADJUSTMENT]}
        balanceDelta: {type: integer}
        balanceAfter: {type: integer, minimum: 0}
        reservationUnits: {type: integer, nullable: true}
        orderId: {type: string, format: uuid, nullable: true}
        reservationId: {type: string, format: uuid, nullable: true}
        createdAt: {type: string, format: date-time}
    Package:
      type: object
      required:
      - id
      - name
      - price
      - credits
      - priceVersionId
      - currency
      - version
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        credits:
          type: integer
        priceVersionId: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        version: {type: integer, minimum: 1}
    UpdatePackageRequest:
      type: object
      required:
      - name
      - price
      - credits
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: number
          minimum: 0
        credits:
          type: integer
          minimum: 1
    ReserveCreditRequest:
      type: object
      required:
      - analysisId
      - tenantId
      - actorAccountId
      - patientId
      - billingOwner
      - units
      - generation
      properties:
        analysisId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        actorAccountId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        billingOwner:
          type: object
          required:
          - type
          - id
          properties:
            type:
              type: string
              enum:
              - ACCOUNT
              - CLINIC
            id:
              type: string
              format: uuid
        units:
          type: integer
          enum:
          - 1
        generation:
          type: integer
          minimum: 1
    ReleaseCreditRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          enum:
          - VALIDATION_ABORT
          - STORAGE_ABORT
          - ANALYSIS_ABORT
          - FINAL_FAILURE
          - LOW_QUALITY
    Reservation:
      type: object
      required:
      - reservationId
      - analysisId
      - generation
      - units
      - state
      - createdAt
      properties:
        reservationId:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        generation:
          type: integer
        units:
          type: integer
        state:
          type: string
          enum:
          - RESERVED
          - CAPTURED
          - RELEASED
        createdAt:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - correlationId
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            retryable:
              type: boolean
  responses:
    PricePublication:
      description: Published immutable quote, or replay of that publication.
      content:
        application/json:
          schema:
            type: object
            required: [packageId, priceVersionId, version, displayName, price, amountMinor, currency, credits, status]
            properties:
              packageId: {type: integer}
              priceVersionId: {type: string, format: uuid}
              version: {type: integer}
              displayName: {type: string}
              status: {type: string, enum: [ACTIVE]}
              price: {type: number}
              amountMinor: {type: integer, format: int64}
              currency: {type: string}
              credits: {type: integer}
    ErrorResponse:
      description: Standard AURA error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
