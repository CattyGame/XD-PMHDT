services:
  analysis-api:
    environment:
      Analysis__Report__PublicApiBaseUrl: "https://localhost:${AURA_GATEWAY_HTTPS_PORT:-5443}"

  identity-api:
    ports: !reset []
    environment:
      Kestrel__Endpoints__PrivateHttp__Url: "http://+:8080"
      Kestrel__Endpoints__CameraHttps__Url: "https://+:8443"
      Kestrel__Endpoints__CameraHttps__Certificate__Path: /run/camera-tls/server.crt
      Kestrel__Endpoints__CameraHttps__Certificate__KeyPath: /run/camera-tls/server.key
    volumes:
      - type: bind
        source: "${AURA_CAMERA_TLS_HOME:?Set AURA_CAMERA_TLS_HOME}/identity"
        target: /run/camera-tls
        read_only: true
        bind:
          create_host_path: false

  api-gateway:
    ports: !override
      - "127.0.0.1:${AURA_GATEWAY_HTTPS_PORT:-5443}:8443"
    environment:
      Kestrel__Endpoints__PrivateHttp__Url: "http://+:8080"
      Gateway__RequireCameraHttps: "true"
      Kestrel__Endpoints__CameraHttps__Url: "https://+:8443"
      Kestrel__Endpoints__CameraHttps__Certificate__Path: /run/camera-tls/server.crt
      Kestrel__Endpoints__CameraHttps__Certificate__KeyPath: /run/camera-tls/server.key
    volumes:
      - type: bind
        source: "${AURA_CAMERA_TLS_HOME:?Set AURA_CAMERA_TLS_HOME}/gateway"
        target: /run/camera-tls
        read_only: true
        bind:
          create_host_path: false

  profile-api:
    environment:
      ServiceAuth__PreviousPublicKeyPath: "${AURA_CAMERA_PROFILE_ROTATION_KEY_PATH:-}"
