# Merge after compose.capacity.yaml for the explicit 6 GiB local acceptance profile.
# These are candidate caps: accept only after the real workload stays below the memory gate.
services:
  ai-core:
    mem_limit: 2304m
    cpus: '8.0'
    environment:
      OMP_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
      OPENBLAS_NUM_THREADS: '1'
  postgres:
    mem_limit: 256m
  redis:
    mem_limit: 64m
  rabbitmq:
    mem_limit: 256m
  azurite:
    mem_limit: 192m
  api-gateway:
    mem_limit: 128m
  identity-api:
    mem_limit: 128m
  profile-api:
    mem_limit: 128m
  analysis-api:
    mem_limit: 256m
    environment:
      # Leave native HTTP/storage buffers outside the managed heap budget.
      DOTNET_GCHeapHardLimitPercent: '0x37'
  billing-api:
    mem_limit: 128m
  notification-api:
    mem_limit: 192m
  analysis-worker:
    environment:
      DOTNET_GCHeapHardLimitPercent: '0x37'
    deploy:
      resources:
        limits:
          memory: 256m
