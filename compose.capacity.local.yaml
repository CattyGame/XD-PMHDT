# Merge after compose.capacity.yaml for the explicit 12-CPU / 7 GiB WSL local acceptance profile.
# These are candidate caps: accept only after the real workload stays below the memory gate.
services:
  ai-core:
    mem_limit: 2272m
    cpus: '8.0'
    cpuset: '0-7'
    environment:
      OMP_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
      OPENBLAS_NUM_THREADS: '1'
  postgres:
    mem_limit: 256m
    cpuset: '8-11'
  redis:
    mem_limit: 64m
    cpuset: '8-11'
    command: [redis-server, /usr/local/etc/redis/redis.conf, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD}', --maxmemory, 16mb]
  rabbitmq:
    mem_limit: 384m
    cpuset: '8-11'
  azurite:
    mem_limit: 192m
    cpuset: '8-11'
  api-gateway:
    mem_limit: 160m
    cpuset: '8-11'
    environment:
      DOTNET_GCHeapHardLimit: '0x4000000'
  identity-api:
    mem_limit: 160m
    cpuset: '8-11'
    environment:
      DOTNET_GCHeapHardLimit: '0x6000000'
  profile-api:
    mem_limit: 160m
    cpuset: '8-11'
    environment:
      DOTNET_GCHeapHardLimit: '0x6000000'
  analysis-api:
    mem_limit: 448m
    cpuset: '8-11'
    environment:
      # Leave native HTTP/storage buffers outside the managed heap budget.
      DOTNET_GCHeapHardLimit: '0xC000000'
  billing-api:
    mem_limit: 192m
    cpuset: '8-11'
  notification-api:
    mem_limit: 160m
    cpuset: '8-11'
  analysis-worker:
    cpuset: '8-11'
    environment:
      DOTNET_GCHeapHardLimit: '0xC000000'
      # Native annotation strings leave large-object holes in a long-lived worker.
      DOTNET_GCConserveMemory: '6'
    deploy:
      resources:
        limits:
          memory: 352m
