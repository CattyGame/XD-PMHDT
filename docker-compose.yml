version: '3.8'

services:
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: aura-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - aura-network

networks:
  aura-network:
    name: aura-network
    driver: bridge
