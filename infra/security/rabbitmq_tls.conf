listeners.tcp = none
listeners.ssl.default = 5672
ssl_options.cacertfile = /run/aura-tls/ca.crt
ssl_options.certfile = /run/aura-tls/server.crt
ssl_options.keyfile = /run/aura-tls/server.key
# Server-authenticated TLS plus the existing per-service password/permissions; not mTLS.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
management.ssl.port = 15672
management.ssl.cacertfile = /run/aura-tls/ca.crt
management.ssl.certfile = /run/aura-tls/server.crt
management.ssl.keyfile = /run/aura-tls/server.key
management.ssl.versions.1 = tlsv1.3
management.ssl.versions.2 = tlsv1.2
