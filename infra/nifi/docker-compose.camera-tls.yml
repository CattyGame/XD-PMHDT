services:
  nifi:
    ports: !override
      - "127.0.0.1:${AURA_NIFI_ADMIN_HTTPS_PORT:-8443}:8443"
    environment:
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "localhost:${AURA_NIFI_ADMIN_HTTPS_PORT:-8443}"
      NIFI_CAMERA_ALLOW_HTTP: "false"
      NIFI_CAMERA_IDENTITY_ORIGIN: "https://identity-api:8443"
      NIFI_CAMERA_GATEWAY_ORIGIN: "https://api-gateway:8443"
      NIFI_CAMERA_CLIENT_SECRET: "${NIFI_CAMERA_CLIENT_SECRET:?Set NIFI_CAMERA_CLIENT_SECRET}"
      NIFI_CAMERA_DEVICE_KEYS_JSON: "${NIFI_CAMERA_DEVICE_KEYS_JSON:?Set NIFI_CAMERA_DEVICE_KEYS_JSON}"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/run/camera-trust.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"
    volumes:
      - type: bind
        source: "${AURA_CAMERA_TLS_HOME:?Set AURA_CAMERA_TLS_HOME}/nifi/trust.p12"
        target: /run/camera-trust.p12
        read_only: true
        bind:
          create_host_path: false

  camera-ingress:
    image: nginx@sha256:84ed8c0dd296c188bfc24ed506f46589e9285fb0b11cf3a04d91d524d3067e11
    depends_on: [nifi]
    ports:
      - "127.0.0.1:${AURA_CAMERA_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./camera-ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: "${AURA_CAMERA_TLS_HOME:?Set AURA_CAMERA_TLS_HOME}/ingress"
        target: /run/camera-tls
        read_only: true
        bind:
          create_host_path: false
    networks: [aura_network]
    restart: unless-stopped
