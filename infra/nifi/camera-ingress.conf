server {
    listen 8444 ssl;
    ssl_certificate /run/camera-tls/server.crt;
    ssl_certificate_key /run/camera-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    # A 10 MiB image occupies just over 13 MiB as base64 JSON.
    client_max_body_size 14m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /ingest/camera {
        limit_except POST { deny all; }
        # Avoid proxy temporary files containing the submitted image.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        set $camera_listener nifi:8081;
        proxy_pass http://$camera_listener;
    }

    location / { return 404; }
}
